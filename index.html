<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haris Mohamed | Portfolio</title>

<meta name="description"
content="Haris Mohamed - Computer Science and Business Systems student and aspiring software developer.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* ===============================
   VARIABLES
================================ */

:root {
    --bg: #05060a;
    --card: rgba(15,18,28,.72);
    --border: rgba(255,255,255,.09);

    --text: #f5f7fb;
    --muted: #9298a8;

    --accent: #7c5cff;
    --accent2: #00d4ff;

    --radius: 22px;
}


/* ===============================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}


/* ===============================
   BACKGROUND
================================ */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    background: var(--bg);
}

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 55px 55px;
}

.orb {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .16;
}

.orb.one {
    background: var(--accent);
    top: -200px;
    left: -150px;
}

.orb.two {
    background: var(--accent2);
    right: -180px;
    top: 50%;
}

.cursor {
    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(124,92,255,.08),
            transparent 65%
        );

    transform: translate(-50%,-50%);

    z-index: -1;
}


/* ===============================
   NAVBAR
================================ */

.navbar {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1100px,calc(100% - 30px));

    padding: 12px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(8,10,16,.75);

    backdrop-filter: blur(20px);

    border: 1px solid var(--border);

    border-radius: 18px;

    z-index: 1000;
}

.logo {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-family: "Space Grotesk";

    font-weight: 700;
    font-size: 21px;
}

.nav-links {
    display: flex;
    gap: 5px;
}

.nav-links a {
    padding: 9px 13px;

    color: var(--muted);

    font-size: 13px;
    font-weight: 600;

    border-radius: 10px;

    transition: .3s;
}

.nav-links a:hover,
.nav-links a.active {
    color: white;
    background: rgba(255,255,255,.06);
}

.nav-buttons {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: rgba(255,255,255,.04);

    color: white;

    cursor: pointer;

    transition: .3s;
}

.icon-btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.1);
}

.menu-btn {
    display: none;
}


/* ===============================
   MOBILE MENU
================================ */

.mobile-menu {
    position: fixed;

    top: 85px;
    left: 15px;
    right: 15px;

    padding: 15px;

    background: rgba(10,12,18,.96);

    backdrop-filter: blur(20px);

    border: 1px solid var(--border);

    border-radius: 18px;

    display: none;
    flex-direction: column;

    z-index: 999;
}

.mobile-menu.open {
    display: flex;
}

.mobile-menu a {
    padding: 13px;

    color: var(--muted);

    border-radius: 10px;
}

.mobile-menu a:hover {
    color: white;
    background: rgba(255,255,255,.06);
}


/* ===============================
   SECTIONS
================================ */

section {
    width: min(1100px,calc(100% - 30px));

    margin: auto;

    padding: 120px 0 60px;
}

.label {
    color: var(--accent2);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 3px;

    margin-bottom: 12px;
}

.heading {
    font-family: "Space Grotesk";

    font-size: clamp(34px,5vw,52px);

    line-height: 1.1;

    letter-spacing: -1.5px;

    margin-bottom: 50px;
}

.heading span,
.hero h1 span,
.contact h2 span {
    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent2)
        );

    -webkit-background-clip: text;

    color: transparent;
}


/* ===============================
   HERO
================================ */

.hero {
    min-height: 100vh;

    display: grid;

    grid-template-columns: 1.15fr .85fr;

    align-items: center;

    gap: 60px;

    padding-top: 160px;
}

.status {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    padding: 8px 13px;

    border: 1px solid var(--border);

    border-radius: 30px;

    color: var(--muted);

    font-size: 11px;

    margin-bottom: 25px;
}

.status span {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #38e68c;

    box-shadow: 0 0 12px #38e68c;
}

.hero-small {
    color: var(--muted);

    font-size: 13px;

    letter-spacing: 5px;

    font-weight: 700;

    margin-bottom: 10px;
}

.hero h1 {
    font-family: "Space Grotesk";

    font-size: clamp(55px,8vw,90px);

    line-height: .98;

    letter-spacing: -5px;

    margin-bottom: 20px;
}

.hero h2 {
    font-size: 23px;

    color: #cdd1dc;

    margin-bottom: 22px;

    min-height: 35px;
}

.hero-description {
    max-width: 650px;

    color: var(--muted);

    font-size: 16px;
}

.buttons {
    display: flex;

    gap: 12px;

    margin-top: 30px;
}

.btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    padding: 13px 19px;

    border-radius: 12px;

    font-size: 13px;

    font-weight: 700;

    transition: .3s;
}

.primary {
    background:
        linear-gradient(
            135deg,
            var(--accent),
            #5e91ff
        );

    box-shadow:
        0 12px 30px rgba(124,92,255,.25);
}

.primary:hover {
    transform: translateY(-3px);

    box-shadow:
        0 18px 35px rgba(124,92,255,.35);
}

.secondary {
    border: 1px solid var(--border);

    background: rgba(255,255,255,.03);
}

.secondary:hover {
    background: rgba(255,255,255,.08);

    transform: translateY(-3px);
}

.socials {
    display: flex;

    gap: 10px;

    margin-top: 27px;
}

.socials a {
    width: 39px;
    height: 39px;

    display: grid;
    place-items: center;

    border: 1px solid var(--border);

    border-radius: 11px;

    color: var(--muted);

    transition: .3s;
}

.socials a:hover {
    color: white;

    background: rgba(255,255,255,.07);

    transform: translateY(-4px);
}


/* ===============================
   CODE CARD
================================ */

.code-card {
    width: min(430px,100%);

    border: 1px solid var(--border);

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(124,92,255,.08),
            rgba(0,212,255,.02)
        ),
        rgba(10,12,18,.75);

    box-shadow:
        0 35px 80px rgba(0,0,0,.35);

    transform: rotate(2deg);

    transition: .5s;
}

.code-card:hover {
    transform: rotate(0deg) translateY(-8px);
}

.window-bar {
    height: 48px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 0 18px;

    border-bottom: 1px solid var(--border);
}

.dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;
}

.red {
    background: #ff5f57;
}

.yellow {
    background: #febc2e;
}

.green {
    background: #28c840;
}

.code {
    padding: 32px;

    font-family: monospace;

    color: #b7bdca;

    font-size: 13px;

    line-height: 2;
}

.indent {
    padding-left: 20px;
}

.purple {
    color: #c084fc;
}

.blue {
    color: #60a5fa;
}

.green-text {
    color: #67e8a5;
}

.blink {
    display: inline-block;

    width: 7px;
    height: 17px;

    background: var(--accent2);

    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}


/* ===============================
   ABOUT
================================ */

.about-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;
}

.card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    backdrop-filter: blur(15px);
}

.about-text {
    padding: 35px;
}

.about-text p {
    color: var(--muted);

    margin-bottom: 20px;
}

.about-text strong {
    color: white;
}

.highlights {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.highlight {
    padding: 25px;

    border: 1px solid var(--border);

    border-radius: var(--radius);

    background: rgba(255,255,255,.025);

    transition: .35s;
}

.highlight:hover {
    transform: translateY(-6px);

    border-color: rgba(124,92,255,.35);
}

.highlight i {
    color: var(--accent2);

    font-size: 20px;

    margin-bottom: 15px;
}

.highlight h3 {
    font-size: 15px;

    margin-bottom: 6px;
}

.highlight p {
    color: var(--muted);

    font-size: 12px;
}


/* ===============================
   SKILLS
================================ */

.skills {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.skill {
    padding: 23px;

    display: grid;

    grid-template-columns: 48px 1fr;

    column-gap: 15px;

    border: 1px solid var(--border);

    border-radius: 18px;

    background: rgba(255,255,255,.025);

    transition: .35s;
}

.skill:hover {
    transform: translateY(-5px);

    border-color: rgba(124,92,255,.35);
}

.skill-icon {
    grid-row: span 2;

    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.2),
            rgba(0,212,255,.1)
        );

    color: var(--accent2);

    font-size: 21px;
}

.skill h3 {
    font-size: 15px;
}

.skill p {
    color: var(--muted);

    font-size: 11px;
}

.progress {
    grid-column: 1/-1;

    height: 5px;

    margin-top: 18px;

    background: rgba(255,255,255,.06);

    border-radius: 20px;

    overflow: hidden;
}

.progress span {
    display: block;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent2)
        );
}


/* ===============================
   PROJECTS
================================ */

.projects {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;
}

.project {
    position: relative;

    min-height: 390px;

    padding: 35px;

    display: flex;

    flex-direction: column;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 25px;

    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(124,92,255,.12),
            transparent 35%
        ),
        rgba(255,255,255,.025);

    transition: .45s;
}

.project:hover {
    transform: translateY(-8px);

    border-color: rgba(124,92,255,.4);

    box-shadow:
        0 25px 60px rgba(0,0,0,.25);
}

.project-number {
    position: absolute;

    top: 15px;
    right: 25px;

    font-family: "Space Grotesk";

    font-size: 55px;

    color: rgba(255,255,255,.035);
}

.project-icon {
    width: 58px;
    height: 58px;

    display: grid;
    place-items: center;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-size: 22px;

    margin-bottom: 25px;
}

.project-type {
    color: var(--accent2);

    text-transform: uppercase;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 2px;
}

.project h3 {
    font-family: "Space Grotesk";

    font-size: 25px;

    margin: 8px 0 13px;
}

.project p {
    color: var(--muted);

    font-size: 13px;
}

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 22px;
}

.tags span {
    padding: 6px 9px;

    border: 1px solid var(--border);

    border-radius: 7px;

    color: #aeb4c2;

    font-size: 10px;
}

.project-arrow {
    margin-top: auto;

    align-self: flex-end;

    color: var(--muted);
}


/* ===============================
   EDUCATION
================================ */

.timeline {
    position: relative;

    padding-left: 30px;
}

.timeline:before {
    content: "";

    position: absolute;

    left: 5px;
    top: 0;
    bottom: 0;

    width: 1px;

    background:
        linear-gradient(
            var(--accent),
            transparent
        );
}

.timeline-item {
    position: relative;
}

.timeline-dot {
    position: absolute;

    left: -31px;

    top: 35px;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: var(--accent2);

    box-shadow:
        0 0 0 6px rgba(0,212,255,.08),
        0 0 20px var(--accent2);
}

.timeline-card {
    padding: 35px;
}

.date {
    color: var(--accent2);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;
}

.timeline-card h3 {
    font-family: "Space Grotesk";

    font-size: 25px;

    margin: 10px 0;
}

.timeline-card h4 {
    color: #b7bdca;

    font-size: 14px;

    margin-bottom: 18px;
}

.timeline-card p {
    color: var(--muted);

    font-size: 13px;
}


/* ===============================
   CERTIFICATE
================================ */

.certificate {
    padding: 30px;

    display: flex;

    align-items: center;

    gap: 22px;

    transition: .3s;
}

.certificate:hover {
    transform: translateY(-5px);
}

.certificate-icon {
    width: 62px;
    height: 62px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-size: 25px;
}

.certificate-info {
    flex: 1;
}

.certificate-info span {
    color: var(--accent2);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;
}

.certificate-info h3 {
    font-family: "Space Grotesk";

    font-size: 21px;

    margin: 5px 0;
}

.certificate-info p {
    color: #b4bac8;

    font-size: 13px;
}

.certificate-info small {
    color: var(--muted);

    font-size: 11px;
}

.badge {
    padding: 8px 12px;

    border-radius: 20px;

    color: #61e6a3;

    background: rgba(97,230,163,.08);

    font-size: 10px;

    font-weight: 700;
}


/* ===============================
   CONTACT
================================ */

.contact-box {
    display: grid;

    grid-template-columns: 1.1fr .9fr;

    gap: 50px;

    padding: 55px;

    border: 1px solid var(--border);

    border-radius: 30px;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(124,92,255,.12),
            transparent 35%
        ),
        rgba(255,255,255,.025);
}

.contact h2 {
    font-family: "Space Grotesk";

    font-size: clamp(35px,5vw,55px);

    line-height: 1.05;

    margin-bottom: 20px;
}

.contact-text {
    color: var(--muted);

    font-size: 14px;

    margin-bottom: 27px;
}

.contact-links {
    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 12px;
}

.contact-links a {
    display: flex;

    align-items: center;

    gap: 15px;

    padding: 15px;

    border: 1px solid var(--border);

    border-radius: 15px;

    background: rgba(255,255,255,.025);

    transition: .3s;
}

.contact-links a:hover {
    transform: translateX(6px);

    background: rgba(255,255,255,.06);
}

.contact-links i {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: rgba(124,92,255,.12);

    color: var(--accent2);
}

.contact-links small {
    display: block;

    color: var(--muted);

    font-size: 10px;
}

.contact-links strong {
    font-size: 12px;
}


/* ===============================
   FOOTER
================================ */

footer {
    width: min(1100px,calc(100% - 30px));

    margin: auto;

    padding: 25px 0 35px;

    border-top: 1px solid var(--border);

    display: flex;

    justify-content: space-between;

    color: var(--muted);

    font-size: 11px;
}


/* ===============================
   SCROLL TOP
================================ */

.scroll-top {
    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 43px;
    height: 43px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: rgba(10,12,18,.85);

    color: white;

    cursor: pointer;

    opacity: 0;

    visibility: hidden;

    transition: .3s;

    z-index: 100;
}

.scroll-top.show {
    opacity: 1;

    visibility: visible;
}

.scroll-top:hover {
    background: var(--accent);

    transform: translateY(-4px);
}


/* ===============================
   REVEAL ANIMATION
================================ */

.reveal {
    opacity: 0;

    transform: translateY(30px);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

.reveal.visible {
    opacity: 1;

    transform: translateY(0);
}


/* ===============================
   LIGHT MODE
================================ */

body.light {
    --bg: #f4f6fa;

    --card: rgba(255,255,255,.8);

    --border: rgba(0,0,0,.09);

    --text: #11141b;

    --muted: #687080;
}

body.light .navbar {
    background: rgba(255,255,255,.8);
}

body.light .code-card {
    background: rgba(255,255,255,.8);
}

body.light .mobile-menu {
    background: rgba(255,255,255,.96);
}


/* ===============================
   RESPONSIVE
================================ */

@media(max-width:850px) {

    .nav-links {
        display: none;
    }

    .menu-btn {
        display: inline-block;
    }

    .hero {
        grid-template-columns: 1fr;

        padding-top: 145px;
    }

    .code-card {
        order: -1;
    }

    .about-grid,
    .projects,
    .contact-box {
        grid-template-columns: 1fr;
    }

    .skills {
        grid-template-columns: 1fr;
    }

}


@media(max-width:600px) {

    section {
        padding-top: 100px;
    }

    .hero {
        padding-top: 125px;
    }

    .hero h1 {
        font-size: 58px;

        letter-spacing: -3px;
    }

    .hero h2 {
        font-size: 19px;
    }

    .buttons {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }

    .highlights {
        grid-template-columns: 1fr;
    }

    .project {
        min-height: 350px;

        padding: 28px;
    }

    .certificate {
        flex-direction: column;

        align-items: flex-start;
    }

    .contact-box {
        padding: 30px 22px;
    }

    footer {
        flex-direction: column;

        gap: 10px;

        text-align: center;
    }

}

</style>
</head>

<!-- BACKGROUND -->

<div class="background">

    <div class="grid"></div>

    <div class="orb one"></div>

    <div class="orb two"></div>

</div>

<div c
